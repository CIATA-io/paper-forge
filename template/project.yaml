project:
  name: "my-paper"
  title: "My Paper Title"

manuscript:
  template: "manuscript/manuscript_template.md"
  output_md: "manuscript/manuscript.md"
  output_pdf: "manuscript/manuscript.pdf"
  results_dir: "manuscript/results"
  figures_dir: "manuscript/figures"

result_units:
  prefix_map:
    "01_example": "ex"

# Statistical verdicts are resolved here at compile time and used as {{interp.<key>}}.
# Remove this line only if the manuscript makes no claims about its own results.
interpretations: interpretations.yaml

# Verdicts the four built-in functions cannot express: point at a module defining
# register(engine), and its functions become usable in interpretations.yaml.
# interpretation_functions: scripts/interp_functions.py

# Guard: no hardcoded numbers in the template. Numbers come from result units.
literals:
  enforce: false # `paper-forge gate` enforces regardless
  allow: [] # regexes for legitimate constants (apparatus, protocol)

# Guard: no hardcoded verdicts in the template. Verdicts come from {{interp.*}}.
claims:
  enforce: false # `paper-forge gate` enforces regardless
  allow: [] # regexes for claims that are genuinely static
  extra_patterns: [] # project-specific verdict vocabulary to also catch

# Guard: no verdict stated outright in a result unit. A verdict must be *derived* from
# the statistic (branch on it), or it freezes at whatever was true when it was typed —
# and nothing else scans result units.
unit_verdicts:
  enforce: false # `paper-forge gate` enforces regardless
  allow: [] # regexes for strings that are not claims (axis labels, categories)

# Guard: every citation resolves to a real entry in the bibliography.
citations:
  # Bibliography used to resolve cite keys. Falls back to rendering.bibliography,
  # the manuscript front-matter, then any *.bib next to this file.
  # bibliography: "references.bib"
  enforce: false # `paper-forge gate` enforces regardless
  min_coverage: 0 # e.g. 1.0 to also fail when a bib entry is never cited
  flag_prose_attributions: true # "(Klein et al. 2010)" typed in the text cites nothing
  expand_tokens: auto # auto | pandoc | latex | off
  require_verified: false # true = citing an unverified .bib fails the gate
  allow: [] # regexes for '@'/\cite-shaped text that is not a citation

execution:
  python: "uv run python"

rendering:
  engine: "pandoc"
  pandoc_args:
    - "--pdf-engine=xelatex"
    - "--citeproc"
    - "--number-sections"
